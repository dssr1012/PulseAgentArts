services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseexpends}
      POSTGRES_USER: ${POSTGRES_USER:-pulseexpends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseexpends_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseexpends}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseexpends}:${POSTGRES_PASSWORD:-pulseexpends_dev}@postgres:5432/${POSTGRES_DB:-pulseexpends}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # Allow the public origin through CORS (comma-separated). With the relative
      # /api/v1 default the browser is same-origin so CORS is not even triggered,
      # but set this in case an absolute API URL is configured.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://159.138.118.60,http://localhost:3001}
    volumes:
      - ./backend/keys:/app/keys:ro
      - ./backend/uploads:/app/uploads
    ports:
      - "3000:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time. Relative /api/v1 keeps
        # requests same-origin through nginx (no CORS, works for every visitor).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
